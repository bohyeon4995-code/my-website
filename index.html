<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b52">
<title>잇다 홈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: 데스크톱은 휴대폰 프레임 + 옆 안내 패널, 휴대폰 폭에서는 앱만 꽉 차게 */
:root{
  --bg:#e9ece8; --surface:#ffffff; --surface-2:#f3f5f2; --ink:#18221d; --muted:#5f6b64; --line:#dde2dc;
  --accent:#1f6b4f; --accent-soft:#dcefe5; --baton:#e8a417; --baton-soft:#fbefd2;
  --warn:#b4541c; --warn-soft:#f8e3d6; --ok:#2a7d4f;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-logo:"Black Han Sans","IBM Plex Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201b; --surface-2:#202a24; --ink:#e8eee9; --muted:#9aa89f; --line:#2c3730;
  --accent:#5cc395; --accent-soft:#1d3a2c; --baton:#f0b83a; --baton-soft:#3a2f14;
  --warn:#f08a52; --warn-soft:#3f2416; --ok:#6fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201b; --surface-2:#202a24; --ink:#e8eee9; --muted:#9aa89f; --line:#2c3730;
  --accent:#5cc395; --accent-soft:#1d3a2c; --baton:#f0b83a; --baton-soft:#3a2f14;
  --warn:#f08a52; --warn-soft:#3f2416; --ok:#6fd39a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.side{max-width:320px;min-width:0;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.side h1{font-family:var(--f-logo);font-weight:400;font-size:34px;margin:0;letter-spacing:.5px}
.side p{margin:0;color:var(--muted)}
.rolebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rolebox .lbl{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:10px 6px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}
.screens{display:flex;flex-direction:column;gap:2px;font-size:13px}
.screens button{border:0;background:none;text-align:left;padding:5px 6px;border-radius:6px;color:var(--muted);display:flex;gap:8px}
.screens button:hover{background:var(--surface-2);color:var(--ink)}
.screens code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--accent);min-width:34px}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 48px);min-height:620px;background:var(--surface);border-radius:36px;border:10px solid #111;
  box-shadow:0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}

.mobile-role{display:none;padding:8px max(16px,env(safe-area-inset-left,0px)) 0;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.mobile-role .seg{flex:1}
.mobile-role .seg button{padding:6px}
.status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:600}
.top{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.top h2{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px}
.top .sid{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 5px}
.logo{font-family:var(--f-logo);font-size:22px;color:var(--accent);letter-spacing:.5px}
.body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg{width:22px;height:22px}
.dot{position:absolute;top:5px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:var(--surface-2);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.h{font-weight:700;font-size:16px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.baton{background:var(--baton-soft);color:#8a5d00}
:root[data-theme="dark"] .chip.baton{color:var(--baton)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.baton{color:var(--baton)}}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:#fff;width:100%}
:root[data-theme="dark"] .btn{color:#0d1a13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0d1a13}}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ad{display:flex;gap:10px;align-items:center;background:var(--baton-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ad .tag{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;color:var(--muted)}
.ad .x{border:0;background:none;color:var(--muted);font-size:16px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:6px 0;position:relative}
.step .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.step.done .b{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step.now .b{border-color:var(--baton);background:var(--baton-soft)}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:28px;bottom:-6px;width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--accent)}
.step .t{font-size:14px;font-weight:600}
.step .d{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.ph{border-radius:10px;position:relative;overflow:hidden;background:var(--surface-2);display:flex;align-items:flex-end;color:#fff;font-size:11px;font-weight:600;flex-shrink:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:relative;padding:4px 6px;background:linear-gradient(transparent,rgba(0,0,0,.55));width:100%;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ph.thumb{width:56px;height:56px}
.ph.thumb span{display:none}
.ph.big{width:100%;aspect-ratio:4/3;max-width:100%}
.ph.mid{width:100%;aspect-ratio:1/1}
.stamp{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.room{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 -4px}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
textarea{min-height:76px;resize:vertical}
.req{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.req.done{border-color:var(--accent);background:var(--accent-soft)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;font-size:14px;background:var(--surface-2);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--surface)}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.msg.me .who{display:none}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;max-width:100%}
.msg.card-msg{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.composer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}
.sigpad{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);touch-action:none;width:100%;height:120px;display:block}
.sigbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sigbox .s{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.sigbox .s.ok{border-color:var(--accent);background:var(--accent-soft)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.stars{color:var(--baton);letter-spacing:1px}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:28px;color:var(--line);padding:0}
.starpick button.on{color:var(--baton)}
.unit{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.unit .no{font-weight:700;font-size:15px;background:var(--surface-2);border-radius:10px;height:52px;display:grid;place-items:center}
.unit.locked{opacity:.55}
.plan{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plan.pick{border:2px solid var(--accent)}
.plan .price{font-size:22px;font-weight:700}
.plan ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--ink);color:var(--surface);padding:11px 14px;border-radius:12px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.radio{display:flex;flex-wrap:wrap;gap:6px}
.radio button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.radio button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
@media (max-width:760px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .side{display:none}
  /* 휴대폰에서는 가짜 프레임 없이 일반 페이지처럼 스크롤 (앱 뷰어의 높이 계산과 충돌하지 않게) */
  .phone{width:100%;border:0;border-radius:0;height:auto;min-height:100vh;min-height:100dvh;max-height:none;box-shadow:none;overflow:visible}
  .status{display:none}
  .mobile-role{display:flex!important;padding-top:10px}
  .top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:4;padding-top:10px}
  .body{overflow:visible;flex:1 0 auto;padding-bottom:24px}
  #composer{position:sticky;bottom:62px;background:var(--surface);z-index:4}
  .tabs{position:sticky;bottom:0;z-index:4}
  .toast{position:fixed;bottom:84px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  body{background:var(--surface)}
}
.ob-hero{display:flex;flex-direction:column;gap:10px;padding:36px 4px 12px}
.ob-hero .big{font-family:var(--f-logo);font-size:46px;color:var(--accent);line-height:1}
.ob-hero p{margin:0}
.ob-art{height:150px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--baton-soft));position:relative;overflow:hidden}
.ob-art i{position:absolute;bottom:0;background:var(--surface);border:2px solid var(--accent);border-bottom:0;border-radius:6px 6px 0 0}
.ob-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ob-steps i{height:4px;border-radius:2px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>*{min-width:0}
input[type=email],input[type=password],input[type=tel],input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.rolecard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.rolecard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rolecard .ic{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--accent)}
.rolecard .ic svg{width:28px;height:28px}
.unitchips{display:flex;flex-wrap:wrap;gap:6px}
.unitchips span{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:13px}
.unitchips button{border:0;background:none;color:inherit;font-size:15px;line-height:1;padding:0 4px}
.acct{font-size:14px}
[hidden]{display:none!important}
.top .sid{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>LTE 100%</span></div>
    
    <div class="top" id="top"></div>
    <div class="body" id="body"></div>
    <div id="composer"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 record:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
 repair:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
 units:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>',
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>'
};
const HUES={wall:'#b9b3a6',floor:'#a77b55',tile:'#9fb7bf',wood:'#8a6648',white:'#c9cdc8',metal:'#8d969b',glass:'#90a9b8',dark:'#5f6660'};
function phHTML(p,cls){
  if(!p) return `<div class="ph ${cls}" style="background:var(--surface-2)"><span style="color:var(--muted);background:none;text-shadow:none">사진 없음</span></div>`;
  if(p.src) return `<div class="ph ${cls}"><img src="${p.src}" alt="${p.label}"><span>${p.label}</span></div>`;
  const c=HUES[p.tone]||HUES.wall;
  const mark=p.mark?`<i style="position:absolute;left:${p.mark[0]}%;top:${p.mark[1]}%;width:${p.mark[2]}%;height:${p.mark[2]*.35}%;background:rgba(40,30,20,.55);border-radius:40%;transform:rotate(-12deg)"></i>`:'';
  return `<div class="ph ${cls}" style="background:linear-gradient(160deg,${c} 0%,${shade(c,-18)} 100%)">${mark}<span>${p.label}</span></div>`;
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}
const NAMES={tenant:'김학생',landlord:'나주인'};

/* ---------- 예시 데이터 ---------- */
const S={
 role:'tenant', screen:'home', stack:[], adOpen:true,
 schedule:{proposed:['11월 1일 (토) 오전 10시','11월 2일 (일) 오후 2시'],agreed:'11월 2일 (일) 오후 2시'},
 items:[

function collect(){document.querySelectorAll('[data-f]').forEach(el=>{D[el.dataset.f]=el.type==='checkbox'?el.checked:el.value.trim()})}
function obGo(sc){obErr={};S.stack.push(S.screen);S.screen=sc;render()}
function obAction(a,t){
 switch(a){
  case 'obGo':obGo(t.dataset.v);return true;
  case 'login':{const a2=loadAcct();if(a2){applyAcct(a2);render();toast(`${a2.name} 님, 다시 오셨네요`)}else toast('저장된 계정이 없어요. 시작하기로 가입해주세요');return true}
  case 'allTerms':{const v=t.checked;D.t1=D.t2=D.t3=v;render();return true}
  case 'obSignup':obErr={};obGo('ob-role');return true;
  case 'pickRole':D.role=t.dataset.v;render();return true;
  case 'obRole':if(!D.role)D.role='tenant';obGo('ob-info');return true;
  case 'sendCode':obErr={};if(D.phone.replace(/\D/g,'').length<10){obErr.phone='휴대폰 번호를 확인해주세요';render();return true}D.codeSent=true;D.verified=false;render();toast('인증번호를 보냈어요');return true;
  case 'verify':obErr={};D.verified=true;toast('휴대폰 인증이 끝났어요');render();return true;
  case 'obInfo':obErr={};obGo('ob-place');return true;
  case 'unitSt':D.unitSt=t.dataset.v;render();return true;
  case 'addUnit':{obErr={};const u=D.unitIn.replace(/호$/,'').trim();if(!u){obErr.units='호수를 입력해주세요'}else if(D.units.some(x=>x.no===u)){obErr.units='이미 추가한 호실이에요'}else{D.units.push({no:u,status:D.unitSt,name:D.unitSt==='공실'?'':D.unitName,end:D.unitEnd});D.unitIn='';D.unitName='';D.unitEnd=''}render();const el=document.getElementById('f-unitIn');if(el)el.focus();return true}
  case 'delUnit':D.units.splice(+t.dataset.k,1);render();return true;
  case 'obDone':{obErr={};
   if(D.unitIn&&!D.units.some(x=>x.no===D.unitIn.replace(/호$/,''))){D.units.push({no:D.unitIn.replace(/호$/,''),status:D.unitSt,name:D.unitSt==='공실'?'':D.unitName,end:D.unitEnd});D.unitIn=''}
   const a={email:D.email,role:D.role,name:D.name,birth:D.birth,phone:D.phone};
   if(D.role==='tenant')Object.assign(a,{addr:D.addr,building:D.building,unit:D.unit.replace(/호$/,''),start:D.start,end:D.end,deposit:D.deposit,rent:D.rent,lname:D.lname,lphone:D.lphone});
   else Object.assign(a,{laddr:D.laddr,lbuilding:D.lbuilding,units:D.units.map(u=>({...u}))});
   a.name=a.name||(D.role==='tenant'?'김학생':'나주인');
   if(D.role==='tenant'){a.building=a.building||'우왕빌';a.unit=a.unit||'302';a.lname=a.lname||'나주인'}else{a.lbuilding=a.lbuilding||'우왕빌';const first=a.units.find(u=>u.status==='입주 예정');a.tname=(first&&first.name)||'김학생'}
   saveAcct(a);applyAcct(a);render();toast('가입을 마쳤어요. 반가워요');return true}
  case 'logout':clearAcct();location.reload();return true;
 }
 return false;
}

function render(){
  const v=V[S.screen]();const ob=S.screen.startsWith('ob-');
  document.getElementById('top').innerHTML=ob?v.top:personalize(v.top);
  document.getElementById('body').innerHTML=ob?v.body:personalize(v.body);
  document.getElementById('composer').innerHTML=v.composer||'';
  document.getElementById('tabs').hidden=ob;
  /*removed*/
  const tabs=TABS[S.role];const tabRoot=S.stack[0]||S.screen;
  const badge={record:openReqs(),repairs:S.repairs.filter(r=>r.status==='접수').length,chat:0,units:todo().length};
  document.getElementById('tabs').style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  document.getElementById('tabs').innerHTML=tabs.map(([k,l,ic])=>`<button data-tab="${k}" ${tabRoot===k?'aria-current="page"':''}>${ICON[ic]}${l}${badge[k]?`<span class="dot">${badge[k]}</span>`:''}</button>`).join('');
  document.querySelectorAll('#roleSeg button,#roleSeg2 button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  /*removed*/
  if(S.screen==='sign') setupSig();
  if(S.screen==='chat'){const b=document.getElementById('body');b.scrollTop=b.scrollHeight;if(isMobile())window.scrollTo(0,document.documentElement.scrollHeight)}
  const up=document.getElementById('upl'); if(up) up.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=S.items.find(x=>x.id===curItem);i.photos.push({src:rd.result,label:'방금 올린 사진'});i.done=true;i.by=i.by||S.role;render();toast('사진을 추가했어요. 촬영 시각과 위치가 함께 저장돼요.')};rd.readAsDataURL(f)};
}

let sigDrawn=false;
function setupSig(){const c=document.getElementById('sig');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle=getComputedStyle(document.body).color;sigDrawn=false;let d=false;
 const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(!d)return;x.lineTo(...p(e));x.stroke();sigDrawn=true};
 c.onpointerup=()=>d=false;}

/* ---------- 동작 ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-go]');if(!t)return;
 if(S.screen.startsWith('ob-'))collect();
 if(t.dataset.act&&obAction(t.dataset.act,t))return;
 if(t.dataset.jump){const k=t.dataset.jump;if(k.startsWith('ob-')){const i=OB.findIndex(o=>o[0]===k);S.stack=OB.slice(0,i).map(o=>o[0]);obErr={}}else S.stack=[TABS[S.role][0][0]].filter(x=>x!==k);S.screen=k;render();return}
 if(t.dataset.tab){go(t.dataset.tab,{tab:true});return}
 if(t.dataset.go){go(t.dataset.go,{item:t.dataset.item,repair:t.dataset.repair});return}
 const a=t.dataset.act;if(!a)return;
 const item=()=>S.items.find(x=>x.id===curItem);
 const R=()=>S.repairs.find(x=>x.id===curRepair);
 switch(a){
  case 'back':back();break;
  case 'closeAd':S.adOpen=false;render();break;
  case 'saveNote':{const i=item();i.note=document.getElementById('noteTa').value.trim();if(i.note){i.done=true;i.by=i.by||S.role}render();toast('글 기록을 저장했어요');break}
  case 'sendReq':{const v=document.getElementById('reqIn').value.trim();if(!v){toast('요청 내용을 적어주세요');break}const i=item();i.req.push({from:'landlord',text:v,done:false});S.chat.push({from:'landlord',type:'req',item:i.id,text:v});S.sign.landlord=false;render();toast('김서연 님에게 보충 요청을 보냈어요');break}
  case 'fulfill':{const i=item();const r=i.req[+t.dataset.k];r.done=true;i.photos.push({tone:i.photos[0]?.tone||'wall',label:'보충 사진 · 근접'});i.done=true;S.chat.push({from:'tenant',text:`"${i.name}" 보충 사진 올렸어요.`});render();toast('보충 사진을 올렸어요. 박정호 님에게 알렸어요.');break}
  case 'fillAll':S.items.forEach(i=>{if(!i.done){i.done=true;i.by='tenant';i.photos.push({tone:'white',label:i.name});i.note=i.note||'이상 없음'}i.req.forEach(r=>r.done=true)});render();break;
  case 'clearSig':setupSig();break;
  case 'doSign':{if(!sigDrawn){toast('서명 칸에 먼저 서명해주세요');break}const me=S.role,ot=other();S.sign[me]=true;S.chat.push({sys:true,text:`${NAMES[me]} 님이 입주 기록에 서명했어요`});
   if(!S.sign[ot])setTimeout(()=>{S.sign[ot]=true;S.chat.push({sys:true,text:`${NAMES[ot]} 님이 입주 기록에 서명했어요`});if(S.screen==='sign'||S.screen==='home'||S.screen==='units')render();toast(`${NAMES[ot]} 님도 서명했어요`)},1500);
   render();toast('서명했어요');break}
  case 'propose':{const d=document.getElementById('sDate').value,tm=document.getElementById('sTime').value||'14:00';
   const dt=d?new Date(d+'T00:00'):new Date(Date.now()+3*864e5);const h=+tm.split(':')[0],mi=tm.split(':')[1];
   const str=`${dt.getMonth()+1}월 ${dt.getDate()}일 (${'일월화수목금토'[dt.getDay()]}) ${h<12?'오전':'오후'} ${h%12||12}시${mi!=='00'?' '+mi+'분':''}`;
   S.schedule.proposed.push(str);S.chat.push({from:S.role,text:`${str}에 함께 기록하면 어떨까요?`});render();toast('날짜를 제안했어요');
   setTimeout(()=>{S.schedule.agreed=str;S.chat.push({sys:true,text:`${str}, 함께 기록하기로 정했어요`});if(S.screen==='schedule'||S.screen==='home')render();toast(`${NAMES[other()]} 님이 날짜를 수락했어요`)},1500);break}
  case 'inherit':{S.items.forEach(i=>{if(!i.photos.length){i.photos.push({...i.out.photo,label:`${i.name} · 이전 퇴실`});i.note=i.note||(i.out.note?`[이어받음] ${i.out.note}`:'[이어받음] 이전 퇴실 때 이상 없음');i.done=true;i.inherited=true}});S.inherited=true;
   S.chat.push({sys:true,text:'이전 세입자의 퇴실 기록을 입주 기록으로 이어받았어요'});render();toast(`기록 ${S.items.length}개 항목을 이어받았어요`);break}
  case 'demoPhoto':{const i=S.items.find(x=>x.id===curItem);const tone={현관:'metal',거실:'wall',주방:'metal',욕실:'tile',방:'glass'}[i.room]||'wall';
   i.photos.push({tone,label:`${i.name}${i.photos.length?' · '+(i.photos.length+1):''}`});i.done=true;i.by=i.by||S.role;render();toast('사진을 남겼어요. 촬영 시각과 위치가 함께 저장돼요.');break}
  case 'cat':S.newRepair.cat=t.dataset.v;S.newRepair.desc=document.getElementById('rDesc').value;render();break;
  case 'dec':S.newRepair.decision=t.dataset.v;S.newRepair.desc=document.getElementById('rDesc').value;render();break;
  case 'submitRepair':{const n=S.newRepair;const desc=document.getElementById('rDesc').value.trim();const id='r'+(S.repairs.length+1);
    S.repairs.unshift({id,title:`${n.cat} 고장 신고`,cat:n.cat,when:'오늘',status:'접수',schedule:'',vendor:n.decision==='제휴 수리업체 견적 받기'?'견적 받는 중':'',photo:{tone:'metal',label:'주방 수전 물 샘'},desc,decision:n.decision==='제휴 수리업체 견적 받기'?'제휴 업체 견적 받기':null,log:[{who:'tenant',t:'방금',text:`사진과 함께 접수했어요. 희망: ${n.decision||'선택 안 함'}`}]});
    S.chat.push({from:'tenant',type:'repair',repair:id,text:`${n.cat} · ${desc.slice(0,30)}…`});curRepair=id;S.stack=['repairs'];S.screen='repair';render();toast('박정호 님에게 수리 요청을 보냈어요');break}
  case 'ldec':R().decision=t.dataset.v;render();break;
  case 'confirmRepair':{const r=R();if(!r.decision){toast('처리 방법을 먼저 골라주세요');break}const d=document.getElementById('rDate').value;r.status='일정 확정';r.schedule=d.replace(/-/g,'.');r.vendor=r.decision==='세입자 부담'?'세입자 직접':'임대인 지정 기사';r.log.push({who:'landlord',t:'방금',text:`${r.decision}로 결정했어요. ${r.schedule}에 방문해요.`});render();toast(`${r.tenant||'김서연'} 님에게 일정을 보냈어요`);break}
  case 'repairDone':{const r=R();r.status='수리 완료';r.log.push({who:'tenant',t:'방금',text:'수리 잘 끝났어요. 감사합니다!'});render();toast('수리 완료로 기록했어요.');break}
  case 'sendChat':{const v=document.getElementById('chatIn').value.trim();if(!v)break;S.chat.push({from:S.role,text:v});render();break}
  case 'agree':{const i=S.items.find(x=>x.id===t.dataset.id);i.out.agreed=true;render();toast('합의했어요. 상대방에게도 표시돼요.');break}
  case 'disagree':S.chat.push({from:S.role,text:`퇴실 비교 "${S.items.find(x=>x.id===t.dataset.id).name}" 항목 이야기 나눠요.`});go('chat');break;
  case 'star':{const ta=document.getElementById('revTa');if(ta)S.myReview.text=ta.value;S.myReview.s=+t.dataset.v;render();break}
  case 'tag':t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');break;
  case 'sendReview':{const m=S.myReview;const ta=document.getElementById('revTa');m.text=ta?ta.value.trim():'';const R=S.reviews[other()];
   R.list.unshift({who:`${S.role==='tenant'?'세입자':'임대인'} ${NAMES[S.role]} · 방금`,s:m.s,text:m.text});R.avg=Math.round((R.avg*R.n+m.s)/(R.n+1)*10)/10;R.n++;m.sent=true;render();toast('별점과 코멘트를 남겼어요');break}
  case 'unit':{const k=+t.dataset.k;if(S.plan==='free'&&k>0){go('plans');toast('2개 호실부터는 구독이 필요해요');break}if(k===0){go(S.schedule.agreed?'record':'schedule')}else{const u=S.units[k];toast(u.who==='공실'?`${u.no}호는 공실이에요. 세입자를 초대하면 함께 기록할 수 있어요`:`${u.no}호 · ${u.who} 님 · ${u.sub}`)}break}
  case 'plan':S.plan=t.dataset.v;render();toast(S.plan==='free'?'무료 요금제로 바꿨어요':'구독을 시작했어요');break;
 }
});
document.addEventListener('change',e=>{const t=e.target;if(!S.screen.startsWith('ob-'))return;collect();if(t.dataset.act==='allTerms'){obAction('allTerms',t)}else if(t.type==='checkbox'){render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f-unitIn'){e.preventDefault();collect();obAction('addUnit',e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn'){document.querySelector('[data-act="sendChat"]').click()}});
S.screen='ob-welcome'; // 시연용: 열 때마다 가입 화면부터
render();
</script>
